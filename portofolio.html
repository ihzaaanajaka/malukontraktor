  <style>
    /* ═══════════════════════════════════════════════════
       PORTOFOLIO CARD GRID — referensi style
    ═══════════════════════════════════════════════════ */

    /* ── Card grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .card-porto {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      transition: transform .28s ease, box-shadow .28s ease;
      cursor: pointer;
      display: block;
    }
    body.dark-mode .card-porto {
      background: var(--bg-2);
      box-shadow: 0 2px 16px rgba(0,0,0,.28);
    }
    .card-porto:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 32px rgba(0,0,0,.13);
    }

    /* foto + skeleton shimmer loading */
    .card-porto__thumb {
      position: relative;
      width: 100%;
      padding-top: 68%; /* rasio ~3:2 */
      overflow: hidden;
      background: linear-gradient(
        100deg,
        #e8e6e1 30%,
        #f3f1ed 50%,
        #e8e6e1 70%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    body.dark-mode .card-porto__thumb {
      background: linear-gradient(
        100deg,
        rgba(255,255,255,.04) 30%,
        rgba(255,255,255,.09) 50%,
        rgba(255,255,255,.04) 70%
      );
      background-size: 200% 100%;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .card-porto__thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .55s ease, opacity .4s ease;
      opacity: 0;
    }
    .card-porto__thumb img.is-loaded {
      opacity: 1;
    }
    .card-porto__thumb.is-loaded {
      animation: none;
      background: none;
    }
    .card-porto:hover .card-porto__thumb img {
      transform: scale(1.07);
    }

    /* lokasi di bawah foto */
    .card-porto__body {
      padding: .85rem 1rem .95rem;
      text-align: center;
    }
    .card-porto__loc {
      font-size: .8rem;
      color: var(--ink-2);
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: .35rem;
    }
    .card-porto__loc i {
      color: var(--orange);
      font-size: .72rem;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    }
    @media (max-width: 560px) {
      .card-grid { grid-template-columns: 1fr; gap: .85rem; }
    }
  </style>
